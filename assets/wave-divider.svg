<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 6" width="100%" height="6" fill="none">
  <defs>
    <linearGradient id="waveDividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9">
        <animate attributeName="stop-color" values="#0EA5E9;#38BDF8;#6366F1;#A855F7;#0EA5E9" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="35%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#6366F1;#A855F7;#0EA5E9;#38BDF8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#6366F1">
        <animate attributeName="stop-color" values="#6366F1;#A855F7;#0EA5E9;#38BDF8;#6366F1" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#0EA5E9;#38BDF8;#6366F1;#A855F7" dur="6s" repeatCount="indefinite" />
      </stop>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;0%;100%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Subtle soft glow around the line -->
    <filter id="softGlow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing outer line -->
  <rect x="10" y="1.5" width="780" height="3" rx="1.5" fill="url(#waveDividerGrad)" opacity="0.5" filter="url(#softGlow)"/>

  <!-- Core crisp line -->
  <rect x="10" y="1.5" width="780" height="3" rx="1.5" fill="url(#waveDividerGrad)"/>
</svg>
